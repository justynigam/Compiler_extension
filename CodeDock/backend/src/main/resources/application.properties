spring.application.name=codedock

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/codedock
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Docker
codedock.docker.socket=unix:///var/run/docker.sock
codedock.execution.timeout-seconds=30
codedock.execution.memory-limit-mb=256

# Server
server.port=8080